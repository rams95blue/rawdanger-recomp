; Raw Danger! PC recomp settings - edit and restart the game.

[disc]
; Original US disc image. Needed when the game reads data by raw sector
; number (LBA). Path is relative to this folder, or absolute.
image = Raw Danger (USA).iso

[display]
; 4:3 or 16:9. 16:9 also needs [patches] widescreen = true.
aspect = 16:9

[patches]
; Runtime data patches from patches/patchdb.json (group names).
widescreen = true

[memory]
; game = Raw Danger's PS2 layout: heap up to its own stack (0x01FE8000),
;        runtime pools + interrupt stacks moved into the EE kernel area.
; upstream = ps2recomp defaults (heap capped at 0x01F00000 - the game can't boot).
layout = game
heap_limit = 0x01FE8000
runtime_pools = 0x00020000
callback_stacks = 0x00052000-0x00080000

[audio]
; en = original English cast, jp = Japanese cast (needs voice_jp/ pack,
; built by tools/rd_voicepack.py from your JP disc).
voice_language = en

[hle]
; Game-side SDK functions routed to the runtime's own handlers. Leave on.
sceCdLayerSearchFile = 1
sceCdSearchFile = 1
; Sound-bank uploads to SPU2 RAM are answered without the IOP until
; SPU2 audio is emulated (the IOP path deadlocks, see docs/WORKFLOW.md).
spu_bank_upload = 1
; Controller: libpad2 calls answered from the keyboard / first gamepad
; (ps2xIOP has no DBCMAN pad driver, so without this there is no input).
pad = 1

[movies]
; FMVs need an MPEG-2 decoder the runtime doesn't have yet; 1 skips them
; (otherwise the game hangs at the first movie).
skip = 1

[debug]
log = true
; The game's compiled-out debug printf, routed to this console (US 0x2C6240; off to disable).
game_printf = 0x2C6240
; Log calls/returns of game functions, e.g. trace = 0x2C9DD0, 0x2C8CD0, 0x2C8B70
; (also: rd run --trace ..., or the RD_TRACE environment variable)
trace =
; Log every guest thread's state every N seconds (0 = off; or rd run --threads N)
thread_dump = 0
; F9 records the next N frames of GS traffic to gs_captures/*.gsr (renderer debugging;
; tools/gs_replay renders a capture offline). 0 disables the key.
gs_capture_frames = 2
; Start one capture automatically N seconds after boot (0 = off; or rd run --gscap N).
gs_capture_at = 0
